<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashly's Room</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    /* same cream as the edges of room.jpg (very slightly warmer at the bottom) */
    background: #F2E6D6 linear-gradient(#F2E6D6, #F2E5D2) fixed;
  }
  /* The stage keeps the image's aspect ratio and fits the window without cropping.
     The background image and the 3D canvas share this exact box, so they stay aligned on resize. */
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 2752 / 1536));
    height: min(100vh, calc(100vw * 1536 / 2752));
    opacity: 0; /* hidden (only the cream background shows) until the image and all models are loaded */
    transform-origin: 50% 50%;
  }
  #stage img, #stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #stage img { user-select: none; -webkit-user-drag: none; }
  /* Soft light-mood layers between the room picture and the 3D canvas. */
  #stage .mood {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    will-change: opacity;
  }

  /* --u = 1% of the stage width, so stickers and focus rings scale with the room. */
  /* Invisible keyboard targets over each object (mouse uses the 3D shapes instead). */
  #stage .hotspots { position: absolute; inset: 0; pointer-events: none; }
  #stage .hotspot {
    position: absolute;
    pointer-events: none;
    margin: 0; padding: 0; border: 0;
    background: transparent;
    border-radius: calc(var(--u) * 0.9);
    outline: none;
  }
  #stage .hotspot:focus-visible {
    box-shadow: 0 0 0 calc(var(--u) * 0.18) #fff, 0 0 0 calc(var(--u) * 0.38) #8a5a3c;
  }

  /* The sticker that peels off the wall. */
  #stage .sticker {
    position: absolute;
    box-sizing: border-box;
    background: #fffdf8;
    border: calc(var(--u) * 0.55) solid #fff;
    border-radius: calc(var(--u) * 1.1);
    padding: calc(var(--u) * 0.9) calc(var(--u) * 1.15) calc(var(--u) * 1);
    box-shadow: 0 calc(var(--u) * 0.45) calc(var(--u) * 1.4) rgba(90, 55, 30, 0.22),
                0 calc(var(--u) * 0.08) calc(var(--u) * 0.25) rgba(90, 55, 30, 0.18);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    color: #4a3428;
    opacity: 0;
    transform-origin: left center;
    pointer-events: none;
  }
  #stage .sticker.on { pointer-events: auto; }
  /* Text scales with the room but never gets smaller than 22 px (title) / 15 px (line + link). */
  #stage .sticker { min-width: 250px; }
  #stage .sticker-title { font-weight: 800; font-size: max(22px, calc(var(--u) * 1.35)); line-height: 1.15; }
  #stage .sticker-text { margin-top: calc(var(--u) * 0.45); font-size: max(15px, calc(var(--u) * 0.85)); line-height: 1.35; color: #6b5244; }
  #stage .sticker-link {
    display: inline-block;
    margin-top: calc(var(--u) * 0.7);
    font-size: max(15px, calc(var(--u) * 0.85));
    font-weight: 700;
    color: #b8572f;
    text-decoration: none;
    border-bottom: calc(var(--u) * 0.12) solid currentColor;
  }
  #stage .sticker-link:hover { color: #8f3f1f; }
  #stage .sticker-link:focus-visible { outline: 2px solid #b8572f; outline-offset: 3px; border-radius: 3px; }

  /* Small tag next to a hovered / focused object, same sticker style. */
  #stage .tag {
    position: absolute;
    box-sizing: border-box;
    pointer-events: none;
    white-space: nowrap;
    background: #fffdf8;
    border: calc(var(--u) * 0.35) solid #fff;
    border-radius: calc(var(--u) * 0.8);
    padding: calc(var(--u) * 0.45) calc(var(--u) * 0.8) calc(var(--u) * 0.5);
    box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 0.9) rgba(90, 55, 30, 0.22),
                0 1px 2px rgba(90, 55, 30, 0.16);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    color: #4a3428;
    opacity: 0;
    transform: translateY(4px) rotate(var(--tilt, -3deg)) scale(0.94);
    transition-property: opacity, transform;
    transition-timing-function: ease-out;
  }
  #stage .tag.on { opacity: 1; transform: translateY(0) rotate(var(--tilt, -3deg)) scale(1); }
  #stage .tag-title { font-weight: 800; font-size: max(15px, calc(var(--u) * 0.95)); line-height: 1.15; }
  #stage .tag-hint { margin-top: 2px; font-size: max(12px, calc(var(--u) * 0.65)); color: #8a6a58; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage">
  <img src="room.jpg" alt="An isometric cozy room" draggable="false">
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   SCENE_CONFIG: every position, size and rotation lives here.

   World units = pixels of room.jpg (2752 x 1536).
   Origin = the back floor corner, where the two walls meet.
     +x runs along the RIGHT wall toward the front-right.
     +z runs along the LEFT wall toward the front-left.
     +y is up.

   So for any point:  x = distance from the LEFT wall,  z = distance from the RIGHT wall.
   The floor is a square from (0,0) to (1207,1207).

   Each model:
     at         - [x, z] world position of the CENTER OF THE OBJECT'S BASE.
     surface    - which surface it stands on (its height and footprint are in `surfaces`).
     heightFrac - on-screen height of the object as a fraction of the image height.
     faceDeg    - which way the object's front faces (world yaw):
                    0  = straight out of the right wall (+z)
                    90 = straight out of the left wall (+x)
                    45 = straight at the viewer
     modelYawDeg - extra turn to fix a model whose "front" is not +z in its file.
     shadow     - size multiplier for its soft contact shadow.
   ===================================================================== */
const SCENE_CONFIG = {
  image: { src: 'room.jpg', width: 2752, height: 1536 },

  camera: {
    yawDeg: 45,          // looking straight into the back corner
    elevationDeg: 27.4,  // how far the camera looks down
    originPx: [1404, 660], // where the back floor corner sits in room.jpg
    zoom: 1,             // 1 = one world unit per image pixel
  },

  // Room box, used only by the ?debug outline.
  room: { size: 1207, wallHeight: 627 },

  // Surfaces objects stand on, measured from the illustration.
  //   y = height of the top, x/z = footprint [min, max] (shown with ?debug).
  surfaces: {
    ground: { y: -73 },                                    // outside, below the floor slab
    floor:  { y: 0,   x: [0, 1207],  z: [0, 1207] },
    rug:    { y: 2,   x: [535, 913], z: [127, 505] },     // round rug, center (724, 316), radius ~189
    desk:   { y: 190, x: [0, 230],   z: [656, 1066] },    // against the left wall, under the window
    shelf:  { y: 400, x: [0, 90],    z: [290, 600] },     // wall shelf on the left wall
    bench:  { y: 115, x: [555, 940], z: [15, 125] },      // low bench along the right wall
  },

  lights: {
    hemiSky: 0xfff3e2, hemiGround: 0xe9c7a6, hemiIntensity: 1.4,
    keyColor: 0xfff0dc, keyIntensity: 1.6, keyPosition: [-200, 1400, 1400],
    environmentIntensity: 0.45,
    exposure: 1.0,
  },

  materials: { roughnessMin: 0.85, metalness: 0 },

  contactShadow: { color: 0x6e4a30, opacity: 0.4, padding: 1.35 },

  /* Mouse reaction (step 2).
     The mouse's horizontal position becomes a "mood" from -1 (left) to +1 (right), 0 = middle. */
  interaction: {
    middleZone: 0.12,     // fraction of half the window around the center that counts as "middle"
    fadeSeconds: 0.6,     // how long lights and turn take to settle
    returnSeconds: 1.2,   // slower, calmer return when the mouse leaves the window
    maxTurnDeg: 25,       // how far Ashly turns toward the mouse side (never more than ~30)
    strength: 1,          // overall multiplier for every light change below (0 = off)

    // Layers on the room picture. center/size are % of the image; max = opacity at full mood.
    overlays: {
      daylight: { side: 'left',  color: '#c6ddff', blend: 'screen',     center: [30, 44], size: [26, 46], max: 0.5 },
      lampGlow: { side: 'right', color: '#ffa552', blend: 'soft-light', center: [62, 42], size: [26, 44], max: 1.0 },
      lampLift: { side: 'right', color: '#ffd59c', blend: 'screen',     center: [61, 40], size: [22, 36], max: 0.4 },
      dimLeft:  { side: 'dimLeft',  color: '#6f5444', blend: 'multiply', center: [30, 48], size: [28, 48], max: 0.45 },
      dimRight: { side: 'dimRight', color: '#6f5444', blend: 'multiply', center: [67, 48], size: [28, 48], max: 0.45 },
    },

    // Matching 3D lights (world units, see the axes note above).
    lights3d: {
      daylight: { color: 0xd2e3ff, position: [140, 460, 860], distance: 1250, max: 2.4 }, // near the window
      lamp:     { color: 0xffa95e, position: [436, 430, 120], distance: 1200, max: 2.8 }, // at the floor lamp
      hemiDip: 0.2,   // the overall fill drops this much at full mood, so the "off" side dims
    },
  },

  /* Intro animation (step 3). All times in seconds from the start of the intro.
     Plays once per browser session; a click or key press skips it; "reduce motion" skips it.
     Test helpers: ?intro plays it again, ?introAt=1.2 freezes it at that moment. */
  intro: {
    enabled: true,
    room: {
      start: 0, end: 0.6,
      fromScale: 0.85,   // room image + 3D layer start at 85% size, transparent
      bounce: 1.4,       // strength of the soft overshoot at the end (0 = none)
    },
    ashly: {
      start: 0.5, end: 1.4,
      fromDeg: 80,       // starts turned 80° to HER left (side view, never her back); turns clockwise
                         // (use -80 and overshootDeg 10 for the opposite, counter-clockwise turn)
      overshootDeg: -10, // swings this far past the front, then settles
      turnFrac: 0.65,    // part of the time spent on the main turn (rest = settling back)
    },
    objects: {
      gatherAt: 0.9,     // the 9 objects appear, tiny, around Ashly's hand
      start: 1.1,        // first object leaves
      stagger: 0.08,     // delay between objects
      duration: 0.66,    // flight + landing time of each object (last one lands at ~2.4 s)
      flightFrac: 0.78,  // part of `duration` spent flying; the rest is the landing bounce
      fromScale: 0.15,   // size at the hand
      sweepDeg: 70,      // how far each one swings around Ashly (same direction for all = fan)
      order: 'right-to-left', // which side leaves first: 'right-to-left' or 'left-to-right'
      lift: 140,         // how high the arcs rise (world units)
      hop: 14,           // height of the small landing bounce
      handPoint: [830, 400, 1113], // world point next to Ashly's raised hand
      gatherRadius: 40,  // how tightly they are bunched at the hand
    },
  },

  /* Sticker texts (step 4) — edit these freely.
     `link` = project page; leave it out (or null) for hobby objects, which then show no link. */
  stickerLinkText: 'View project →',
  tagText: 'Click to open', // small line on the hover tag (the tag's title comes from `stickers`)
  stickers: {
    bloombento:    { title: 'BloomBento',             text: 'Short description coming soon.', link: '/bloombento.html' },
    jobhub:        { title: 'Job Search Tracker',     text: 'Short description coming soon.', link: '/job-search-tracker.html' },
    websites:      { title: 'Website Design',         text: 'Short description coming soon.', link: '/website-design.html' },
    'less-stress': { title: 'Design for Less Stress', text: 'Short description coming soon.', link: '/design-for-less-stress.html' },
    parkflux:      { title: 'ParkFlux',               text: 'Short description coming soon.', link: '/parkflux.html' },
    suitcase:      { title: 'Travel',                 text: 'Short description coming soon.' },
    ski:           { title: 'Skiing',                 text: 'Short description coming soon.' },
    keyboard:      { title: 'Music',                  text: 'Short description coming soon.' },
    easel:         { title: 'Drawing',                text: 'Short description coming soon.' },
  },

  /* Clicking objects (step 4). */
  select: {
    hover: { lift: 14, bob: 5, bobSpeed: 0.9, seconds: 0.25 }, // lift + gentle bob when the mouse is over an object
    tag: { fadeSeconds: 0.15, gap: 0.6 },  // hover tag: fade time, distance from the object (% of the image)
    hint: {                                 // gentle wiggle after the intro, once per visit (not with "reduce motion")
      enabled: true,
      object: 'bloombento',
      delay: 0.4,     // seconds after the intro ends
      times: 2,       // number of wiggles
      angleDeg: 6,    // how far it rocks to each side
      seconds: 0.5,   // length of one wiggle
    },
    fly: { seconds: 0.6, arc: 120 },        // flight to / from Ashly's hand (arc = how high it curves)
    hold: {
      point: [958, 600, 1292], // world point where the held object's base floats (just above her open hand)
      grow: 1.5,               // held object is this much bigger...
      maxScreenPx: 200,        // ...but never taller than this on screen
      float: 6, floatSpeed: 0.6, // gentle floating while held
    },
    camera: { zoom: 1.12, origin: [49, 62] }, // eases in toward Ashly; origin = % of the image
    sticker: {
      left: 53.5, top: 17, width: 13, // position and width on the right wall, in % of the image
      tiltDeg: -4,                     // slight tilt once it faces the viewer
      wallSkewDeg: 24.7,               // matches the right wall's slope, so it starts "painted on" the wall
      peelSeconds: 0.55,
    },
  },

  models: [
    { name: 'ashly',       file: 'models/ashly.glb',       surface: 'floor',  at: [1030, 1115], heightFrac: 0.48,  faceDeg: 45, modelYawDeg: 0, shadow: 1 },
    { name: 'websites',    file: 'models/websites.glb',    surface: 'desk',   at: [25, 1032],   heightFrac: 0.112, faceDeg: 90, modelYawDeg: 0, shadow: 1 },
    { name: 'jobhub',      file: 'models/jobhub.glb',      surface: 'desk',   at: [100, 900],   heightFrac: 0.145, faceDeg: 90, modelYawDeg: 0, shadow: 1 },
    { name: 'bloombento',  file: 'models/bloombento.glb',  surface: 'desk',   at: [150, 710],   heightFrac: 0.145,faceDeg: 90, modelYawDeg: 0, shadow: 1 },
    { name: 'less-stress', file: 'models/less-stress.glb', surface: 'shelf',  at: [45, 430],    heightFrac: 0.055, faceDeg: 90, modelYawDeg: 0, shadow: 1 },
    { name: 'suitcase',    file: 'models/suitcase.glb',    surface: 'floor',  at: [145, 58],    heightFrac: 0.11,faceDeg: 45, modelYawDeg: 0, shadow: 1 },
    { name: 'ski',         file: 'models/ski.glb',         surface: 'floor',  at: [280, 62],    heightFrac: 0.163, faceDeg: 45, modelYawDeg: 0, shadow: 1 },
    { name: 'keyboard',    file: 'models/keyboard.glb',    surface: 'bench',  at: [760, 70],    heightFrac: 0.122, faceDeg: 0, modelYawDeg: 0, shadow: 1 },
    { name: 'easel',       file: 'models/easel.glb',       surface: 'rug',    at: [830, 430],   heightFrac: 0.13,  faceDeg: 45, modelYawDeg: 0, shadow: 1 },
    { name: 'parkflux',    file: 'models/parkflux.glb',    surface: 'ground', at: [60, 1466],   heightFrac: 0.11,  faceDeg: 45, modelYawDeg: 0, shadow: 1 },
  ],
};

/* ---------- renderer, scene, camera ---------- */
const DEBUG = new URLSearchParams(location.search).has('debug');
const stage = document.getElementById('stage');
const IMG_W = SCENE_CONFIG.image.width;
const IMG_H = SCENE_CONFIG.image.height;
const DEG = Math.PI / 180;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = SCENE_CONFIG.lights.exposure;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Orthographic camera whose frustum is exactly the image, in image pixels.
// The back floor corner (world origin) lands on camera.originPx.
const camera = (() => {
  const c = SCENE_CONFIG.camera;
  const [u0, v0] = c.originPx;
  const cam = new THREE.OrthographicCamera(-u0, IMG_W - u0, v0, v0 - IMG_H, 1, 20000);
  const yaw = c.yawDeg * DEG, el = c.elevationDeg * DEG, dist = 8000;
  cam.position.set(Math.sin(yaw) * Math.cos(el) * dist, Math.sin(el) * dist, Math.cos(yaw) * Math.cos(el) * dist);
  cam.lookAt(0, 0, 0);
  cam.zoom = c.zoom;
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld();
  return cam;
})();

/* ---------- lights: soft and even, matte look ---------- */
const lights = (() => {
  const L = SCENE_CONFIG.lights;
  const hemi = new THREE.HemisphereLight(L.hemiSky, L.hemiGround, L.hemiIntensity);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(L.keyColor, L.keyIntensity);
  key.position.set(...L.keyPosition);
  scene.add(key);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = L.environmentIntensity;

  // Mood lights: start at 0, the mouse reaction fades them in.
  const makeMoodLight = (c) => {
    const p = new THREE.PointLight(c.color, 0, c.distance, 0); // decay 0 = soft cutoff at `distance`
    p.position.set(...c.position);
    scene.add(p);
    return p;
  };
  const M = SCENE_CONFIG.interaction.lights3d;
  return { hemi, key, daylight: makeMoodLight(M.daylight), lamp: makeMoodLight(M.lamp) };
})();

/* ---------- helpers ---------- */

// Exact on-screen height (in image pixels) of an object, from its vertices.
function screenHeight(object) {
  object.updateMatrixWorld(true);
  const view = camera.matrixWorldInverse;
  const v = new THREE.Vector3();
  let min = Infinity, max = -Infinity;
  object.traverse((m) => {
    if (!m.isMesh) return;
    const pos = m.geometry.attributes.position;
    const toView = new THREE.Matrix4().multiplyMatrices(view, m.matrixWorld);
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(toView);
      if (v.y < min) min = v.y;
      if (v.y > max) max = v.y;
    }
  });
  return max - min;
}

// Exact world bounding box from vertices (Box3.setFromObject can be loose).
function tightBox(object) {
  object.updateMatrixWorld(true);
  const box = new THREE.Box3();
  object.traverse((m) => { if (m.isMesh) box.expandByObject(m, true); });
  return box;
}

function makeShadowTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const shadowTexture = makeShadowTexture();

function addContactShadow(object, y, sizeMul) {
  const S = SCENE_CONFIG.contactShadow;
  // Footprint in the object's own turned frame, so the shadow lines up with it.
  const yaw = object.rotation.y;
  const inv = new THREE.Matrix4().makeRotationY(-yaw);
  const local = new THREE.Box3();
  const v = new THREE.Vector3();
  object.updateMatrixWorld(true);
  object.traverse((m) => {
    if (!m.isMesh) return;
    const pos = m.geometry.attributes.position;
    const toLocal = new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld);
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(toLocal);
      // only the lowest part of the object casts the contact shadow
      local.expandByPoint(v);
    }
  });
  const w = (local.max.x - local.min.x) * S.padding * sizeMul;
  const d = (local.max.z - local.min.z) * S.padding * sizeMul;
  const mat = new THREE.MeshBasicMaterial({
    map: shadowTexture, color: S.color, transparent: true, opacity: S.opacity,
    depthWrite: false, toneMapped: false,
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  plane.rotation.order = 'YXZ';
  plane.rotation.set(-Math.PI / 2, yaw, 0);
  const c = local.getCenter(new THREE.Vector3()).applyMatrix4(new THREE.Matrix4().makeRotationY(yaw));
  plane.position.set(c.x, y + 0.5, c.z);
  plane.renderOrder = -1;
  scene.add(plane);
  return plane;
}

function makeMatte(object) {
  const M = SCENE_CONFIG.materials;
  object.traverse((m) => {
    if (!m.isMesh) return;
    for (const mat of [].concat(m.material)) {
      if ('roughness' in mat) mat.roughness = Math.max(mat.roughness ?? 1, M.roughnessMin);
      if ('metalness' in mat) mat.metalness = M.metalness;
      mat.needsUpdate = true;
    }
  });
}

/* ---------- load and place models ---------- */
const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader().setDRACOLoader(draco);

async function placeModel(cfg) {
  const gltf = await loader.loadAsync(cfg.file);
  const inner = gltf.scene;
  makeMatte(inner);

  // pivot (sits on the surface at `at`; turning it spins the object in place)
  //   └ obj (world facing + scale, offset so its base center is the pivot)
  //       └ inner (per-model fix)
  inner.rotation.y = cfg.modelYawDeg * DEG;
  const obj = new THREE.Group();
  obj.add(inner);
  obj.rotation.y = cfg.faceDeg * DEG;
  const pivot = new THREE.Group();
  pivot.name = cfg.name;
  pivot.add(obj);
  scene.add(pivot);

  // Scale to the wanted on-screen height.
  obj.scale.setScalar((cfg.heightFrac * IMG_H) / screenHeight(pivot));

  // Center of the base on the pivot, bottom exactly on the surface.
  const box = tightBox(pivot);
  const center = box.getCenter(new THREE.Vector3());
  obj.position.set(-center.x, -box.min.y, -center.z);
  const y = SCENE_CONFIG.surfaces[cfg.surface].y;
  pivot.position.set(cfg.at[0], y, cfg.at[1]);
  pivot.updateMatrixWorld(true);

  pivot.userData.shadow = addContactShadow(obj, y, cfg.shadow);
  pivot.userData.surfaceY = y;
  return pivot;
}

/* ---------- debug outline (?debug) ---------- */
function addDebug() {
  const { size: L, wallHeight: H } = SCENE_CONFIG.room;
  const mat = new THREE.LineBasicMaterial({ color: 0x0066ff, depthTest: false });
  const line = (pts, m = mat) => {
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map((p) => new THREE.Vector3(...p))), m);
    l.renderOrder = 999; scene.add(l);
  };
  line([[L, 0, 0], [0, 0, 0], [0, 0, L], [L, 0, L], [L, 0, 0]]);
  line([[0, 0, 0], [0, H, 0]]);
  line([[L, H, 0], [0, H, 0], [0, H, L]]);
  line([[L, 0, 0], [L, H, 0]]);
  line([[0, 0, L], [0, H, L]]);
  const green = new THREE.LineBasicMaterial({ color: 0x00aa44, depthTest: false });
  for (const s of Object.values(SCENE_CONFIG.surfaces)) {
    if (!s.x) continue;
    const [x0, x1] = s.x, [z0, z1] = s.z;
    line([[x0, s.y, z0], [x1, s.y, z0], [x1, s.y, z1], [x0, s.y, z1], [x0, s.y, z0]], green);
  }
  const red = new THREE.LineBasicMaterial({ color: 0xff0033, depthTest: false });
  for (const cfg of SCENE_CONFIG.models) {
    const y = SCENE_CONFIG.surfaces[cfg.surface].y;
    const [x, z] = cfg.at;
    line([[x, y, z], [x, 0, z]], red);
    line([[x - 30, y, z], [x + 30, y, z]], red);
    line([[x, y, z - 30], [x, y, z + 30]], red);
  }
}

/* ---------- size and render ---------- */
function resize() {
  // Layout size (not affected by the intro / camera-zoom transforms).
  const w = stage.clientWidth, h = stage.clientHeight;
  stage.style.setProperty('--u', `${w / 100}px`);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  render();
}
function render() { renderer.render(scene, camera); }
new ResizeObserver(resize).observe(stage);

/* ---------- mouse reaction: light mood + Ashly's turn ---------- */
const I = SCENE_CONFIG.interaction;

// Overlay layers on the room picture (inserted right after the <img>, under the canvas).
const overlayLayers = Object.values(I.overlays).map((o) => {
  const el = document.createElement('div');
  el.className = 'mood';
  const [cx, cy] = o.center, [w, h] = o.size;
  el.style.background = `radial-gradient(ellipse ${w}% ${h}% at ${cx}% ${cy}%, ` +
    `${o.color} 0%, color-mix(in srgb, ${o.color} 55%, transparent) 45%, transparent 100%)`;
  el.style.mixBlendMode = o.blend;
  stage.insertBefore(el, renderer.domElement);
  return { el, o };
});

const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
const state = {
  target: 0,      // where the mood wants to go (-1..1)
  mood: 0,        // current, eased value
  turnTarget: 0,  // where Ashly's turn wants to go (-1..1)
  turn: 0,        // current, eased turn
  seconds: I.fadeSeconds,
  ashly: null,
  interactive: false, // turned on when the intro is over (or skipped)
  held: null,         // the object currently floating above Ashly's hand
  suppressClick: false,
};

// Mouse x (0..1 across the window) -> mood (-1..1) with a calm middle zone and soft edges.
function moodFromX(fx) {
  const m = Math.max(-1, Math.min(1, (fx - 0.5) * 2));
  const t = Math.max(0, (Math.abs(m) - I.middleZone) / (1 - I.middleZone));
  const eased = t * t * (3 - 2 * t); // smoothstep
  return Math.sign(m) * eased;
}

function setTarget(mood, seconds) {
  if (!state.interactive) return; // ignore the mouse during the intro
  state.target = mood;
  // Ashly only turns when nothing is held and "reduce motion" is off.
  state.turnTarget = (reduceMotionQuery.matches || state.held) ? 0 : mood;
  state.seconds = seconds;
  startLoop();
}

function applyMood() {
  const k = I.strength;
  const left = Math.max(0, -state.mood) * k;
  const right = Math.max(0, state.mood) * k;
  const amount = { left, right, dimLeft: right, dimRight: left };
  for (const { el, o } of overlayLayers) el.style.opacity = (amount[o.side] * o.max).toFixed(4);

  const L3 = I.lights3d;
  lights.daylight.intensity = left * L3.daylight.max;
  lights.lamp.intensity = right * L3.lamp.max;
  lights.hemi.intensity = SCENE_CONFIG.lights.hemiIntensity * (1 - L3.hemiDip * (left + right));

  if (state.ashly) state.ashly.rotation.y = state.turn * I.maxTurnDeg * DEG;
}

let rafId = 0, lastTime = 0;
function startLoop() {
  if (rafId) return;
  lastTime = performance.now();
  rafId = requestAnimationFrame(tick);
}
function tick(now) {
  const dt = Math.max(0, Math.min(0.1, (now - lastTime) / 1000));
  lastTime = now;
  // Exponential ease-out: ~98% of the way there after `seconds`.
  const f = 1 - Math.exp(-dt * 4 / state.seconds);
  state.mood += (state.target - state.mood) * f;
  state.turn += (state.turnTarget - state.turn) * f;
  const done = Math.abs(state.target - state.mood) < 1e-3 && Math.abs(state.turnTarget - state.turn) < 1e-3;
  if (done) { state.mood = state.target; state.turn = state.turnTarget; }
  applyMood();
  render();
  rafId = done ? 0 : requestAnimationFrame(tick);
}

window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return; // desktop only
  setTarget(moodFromX(e.clientX / window.innerWidth), I.fadeSeconds);
});
// Mouse leaves the window (or the window loses focus): slowly back to the middle.
document.documentElement.addEventListener('mouseleave', () => setTarget(0, I.returnSeconds));
window.addEventListener('blur', () => setTarget(0, I.returnSeconds));
// "Reduce motion" switched on or off while the page is open.
reduceMotionQuery.addEventListener('change', () => setTarget(state.target, I.fadeSeconds));

/* ---------- intro animation (step 3) ---------- */
const N = SCENE_CONFIG.intro;
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
const easeOutBack = (t, s) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);

function setStage(scale, opacity) {
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  stage.style.opacity = String(opacity);
}

// Work out each object's arc: polar coordinates around Ashly's hand, all swinging the same way.
function prepareFlights(objects) {
  const O = N.objects;
  const [hx, , hz] = O.handPoint;
  const sweep = O.sweepDeg * DEG;
  const back = Math.atan2(-1, -1); // direction away from the viewer, used to order the fan
  const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
  const flights = objects.map((p) => {
    const end = p.position.clone();
    const dx = end.x - hx, dz = end.z - hz;
    const a1 = Math.atan2(dz, dx);
    return { p, end, r1: Math.hypot(dx, dz), a1, a0: a1 - sweep, order: wrap(a1 - back) };
  });
  // Leave in fan order, so the opening sweeps across in one direction.
  // (`order` grows from the left side of the room to the right side.)
  const dir = O.order === 'left-to-right' ? 1 : -1;
  flights.sort((a, b) => dir * (a.order - b.order));
  flights.forEach((f, i) => { f.start = O.start + i * O.stagger; });
  return flights;
}

function introEnd(flights) {
  const lastLanding = flights.length ? flights[flights.length - 1].start + N.objects.duration : 0;
  return Math.max(N.room.end, N.ashly.end, lastLanding);
}

// Pose the whole scene at intro time t (seconds).
function applyIntro(t, flights) {
  // 1. Room pops in.
  const R = N.room;
  const tr = seg(t, R.start, R.end);
  setStage(R.fromScale + (1 - R.fromScale) * easeOutBack(tr, R.bounce),
           easeOutCubic(seg(t, R.start, R.start + (R.end - R.start) * 0.7)));

  // 2. Ashly turns from side view to the front, swings a little past, settles.
  const A = N.ashly;
  const ta = seg(t, A.start, A.end);
  const deg = ta < A.turnFrac
    ? A.fromDeg + (A.overshootDeg - A.fromDeg) * easeInOutSine(ta / A.turnFrac)
    : A.overshootDeg * (1 - easeInOutSine((ta - A.turnFrac) / (1 - A.turnFrac)));
  if (state.ashly) state.ashly.rotation.y = deg * DEG;

  // 3. Objects fly out from her hand along curved arcs and land with a small bounce.
  const O = N.objects;
  const [hx, hy, hz] = O.handPoint;
  const baseShadow = SCENE_CONFIG.contactShadow.opacity;
  for (const f of flights) {
    const { p, end } = f;
    const shadow = p.userData.shadow;
    if (t < O.gatherAt) {
      p.visible = false;
      if (shadow) shadow.material.opacity = 0;
      continue;
    }
    p.visible = true;
    const tt = (t - f.start) / O.duration;
    let q, hop = 0, landed = 0;
    if (tt <= 0) q = 0;
    else if (tt < O.flightFrac) q = easeOutCubic(tt / O.flightFrac);
    else {
      q = 1;
      landed = clamp01((tt - O.flightFrac) / (1 - O.flightFrac));
      hop = O.hop * Math.sin(Math.PI * landed);
    }
    const r = O.gatherRadius + (f.r1 - O.gatherRadius) * q;
    const a = f.a0 + (f.a1 - f.a0) * q;
    const y = hy + (end.y - hy) * q + O.lift * 4 * q * (1 - q) + hop;
    p.position.set(q === 1 ? end.x : hx + r * Math.cos(a), y, q === 1 ? end.z : hz + r * Math.sin(a));
    const appear = easeOutCubic(seg(t, O.gatherAt, O.gatherAt + 0.15)); // grows out of her hand
    p.scale.setScalar(appear * (O.fromScale + (1 - O.fromScale) * q));
    if (shadow) shadow.material.opacity = tt >= 1 ? baseShadow : baseShadow * easeOutCubic(landed);
  }
}

// Final scene: everything in place, mouse effects on.
function finishIntro(flights) {
  for (const f of flights || []) {
    f.p.visible = true;
    f.p.position.copy(f.end);
    f.p.scale.setScalar(1);
    if (f.p.userData.shadow) f.p.userData.shadow.material.opacity = SCENE_CONFIG.contactShadow.opacity;
  }
  if (state.ashly) state.ashly.rotation.y = 0;
  stage.style.transform = '';
  stage.style.opacity = '1';
  state.interactive = true;
  applyMood();
  render();
  startHint();
}

/* ---------- clicking objects (step 4) ---------- */
const SEL = SCENE_CONFIG.select;
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const pickables = [];          // one entry per clickable object
const pickMap = new Map();     // pivot -> entry
const pickRay = new THREE.Raycaster();
const pickNdc = new THREE.Vector2();
const holdVec = new THREE.Vector3(...SEL.hold.point);
const _wiggleQ = new THREE.Quaternion();
let hovered = null;

// After the intro: one gentle wiggle on BloomBento, once per visit, never with "reduce motion".
const HINT_KEY = 'room-hint-played';
function startHint() {
  const H = SEL.hint;
  if (!H.enabled || reduceMotionQuery.matches) return;
  const force = new URLSearchParams(location.search).has('hint'); // test helper
  try {
    if (!force && sessionStorage.getItem(HINT_KEY) === '1') return;
    sessionStorage.setItem(HINT_KEY, '1');
  } catch {}
  const it = pickables.find((i) => i.p.name === H.object);
  if (!it || it === state.held || it === hovered) return;
  it.wiggle = { t: -H.delay, dur: H.times * H.seconds };
  startFx();
}

// Keyboard targets, the sticker and a screen-reader announcer, all inside the stage.
const hotspots = document.createElement('div');
hotspots.className = 'hotspots';
stage.appendChild(hotspots);

const stickerEl = document.createElement('div');
stickerEl.className = 'sticker';
stickerEl.setAttribute('aria-hidden', 'true');
stickerEl.innerHTML = '<div class="sticker-title"></div><div class="sticker-text"></div>' +
  '<a class="sticker-link" tabindex="-1"></a>';
Object.assign(stickerEl.style, {
  left: `${SEL.sticker.left}%`, top: `${SEL.sticker.top}%`, width: `${SEL.sticker.width}%`,
});
stage.appendChild(stickerEl);
const announcer = document.createElement('div');
announcer.className = 'sr-only';
announcer.setAttribute('aria-live', 'polite');
document.body.appendChild(announcer);
// Extra hint read after each object's title by screen readers.
const openHint = document.createElement('div');
openHint.id = 'open-hint';
openHint.className = 'sr-only';
openHint.textContent = 'Press Enter to open';
document.body.appendChild(openHint);

// Small hover / focus tag (hidden from screen readers: the button already says the title).
const tagEl = document.createElement('div');
tagEl.className = 'tag';
tagEl.setAttribute('aria-hidden', 'true');
tagEl.innerHTML = '<div class="tag-title"></div><div class="tag-hint"></div>';
tagEl.style.transitionDuration = `${SEL.tag.fadeSeconds}s`;
stage.appendChild(tagEl);
let tagFor = null;

function showTag(it) {
  if (tagFor === it) return;
  tagFor = it;
  tagEl.querySelector('.tag-title').textContent = it.info.title;
  tagEl.querySelector('.tag-hint').textContent = SCENE_CONFIG.tagText;
  const { box } = it, gap = SEL.tag.gap;
  const onRight = box.right < 82; // near the right edge -> put the tag on the left instead
  Object.assign(tagEl.style, {
    top: `${box.top + (box.bottom - box.top) * 0.05}%`,
    left: onRight ? `${box.right + gap}%` : 'auto',
    right: onRight ? 'auto' : `${100 - box.left + gap}%`,
  });
  tagEl.style.setProperty('--tilt', onRight ? '-3deg' : '3deg');
  // restart the quick fade-in
  tagEl.classList.remove('on');
  void tagEl.offsetWidth;
  tagEl.classList.add('on');
}
function hideTag() {
  tagFor = null;
  tagEl.classList.remove('on');
}
// Tag follows keyboard focus first, then the mouse; never for the held object or one in flight.
function updateTag() {
  if (!state.interactive) return hideTag();
  const focusedItem = pickables.find((i) => i.button === document.activeElement);
  const it = focusedItem || hovered;
  if (it && it !== state.held && !it.anim && it.k === 0) showTag(it);
  else hideTag();
}

const reduced = () => reduceMotionQuery.matches;

// Screen box of an object at rest, in % of the image (for its keyboard target).
function screenBoxPct(p) {
  const v = new THREE.Vector3();
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  p.updateMatrixWorld(true);
  p.traverse((m) => {
    if (!m.isMesh) return;
    const pos = m.geometry.attributes.position;
    for (let i = 0; i < pos.count; i += 4) {
      v.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld).project(camera);
      x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
    }
  });
  const pad = 0.4;
  return { left: (x0 + 1) * 50 - pad, right: (x1 + 1) * 50 + pad, top: (1 - y1) * 50 - pad, bottom: (1 - y0) * 50 + pad };
}

function setupSelection(objects) {
  for (const p of objects) {
    const cfg = SCENE_CONFIG.models.find((m) => m.name === p.name);
    const info = SCENE_CONFIG.stickers[p.name] || { title: p.name, text: '' };
    const box = screenBoxPct(p);
    const it = {
      p, info, box,
      home: p.position.clone(),
      homeImgPx: cfg.heightFrac * IMG_H,
      faceFix: (45 - cfg.faceDeg) * DEG, // extra turn so a held object faces the viewer
      facingAxis: new THREE.Vector3(Math.sin(cfg.faceDeg * DEG), 0, Math.cos(cfg.faceDeg * DEG)),
      wiggle: null, wiggleAngle: 0,      // after-intro hint
      phase: Math.random() * Math.PI * 2,
      hv: 0, hoverTarget: 0, // hover lift (eased)
      k: 0, anim: null,      // 0 = at home, 1 = held above her hand
    };
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'hotspot';
    b.setAttribute('aria-label', info.title);
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-describedby', 'open-hint');
    Object.assign(b.style, {
      left: `${box.left}%`, top: `${box.top}%`,
      width: `${box.right - box.left}%`, height: `${box.bottom - box.top}%`,
    });
    b.addEventListener('click', (e) => { e.stopPropagation(); if (state.interactive) toggle(it); });
    b.addEventListener('focus', () => { it.hoverTarget = 1; it.wiggle = null; startFx(); updateTag(); });
    b.addEventListener('blur', () => { if (hovered !== it) { it.hoverTarget = 0; startFx(); } updateTag(); });
    it.button = b;
    pickables.push(it);
    pickMap.set(p, it);
  }
  // Tab order: left to right across the room.
  pickables.sort((a, b) => (a.box.left + a.box.right) - (b.box.left + b.box.right));
  for (const it of pickables) hotspots.appendChild(it.button);
}

// How big a held object gets: `grow` times its size, capped at maxScreenPx on screen.
function holdScale(it) {
  const cssPerImgPx = stage.clientWidth / IMG_W;
  const zoom = reduced() ? 1 : SEL.camera.zoom;
  const maxImgPx = SEL.hold.maxScreenPx / (cssPerImgPx * zoom);
  return Math.min(it.homeImgPx * SEL.hold.grow, maxImgPx) / it.homeImgPx;
}

function poseItem(it, time) {
  const { p } = it;
  const ek = easeInOutCubic(it.k);
  const still = reduced();
  p.position.lerpVectors(it.home, holdVec, ek);
  p.position.y += SEL.fly.arc * 4 * ek * (1 - ek);
  const bob = still ? 0 : SEL.hover.bob * Math.sin(time * SEL.hover.bobSpeed * Math.PI * 2 + it.phase);
  p.position.y += it.hv * (SEL.hover.lift + bob) * (1 - ek);
  if (!still) p.position.y += ek * SEL.hold.float * Math.sin(time * SEL.hold.floatSpeed * Math.PI * 2);
  p.rotation.set(0, it.faceFix * ek, 0);
  if (it.wiggleAngle) {
    // rock side to side around the object's own facing direction (pivot = center of its base)
    _wiggleQ.setFromAxisAngle(it.facingAxis, it.wiggleAngle);
    p.quaternion.premultiply(_wiggleQ);
  }
  p.scale.setScalar(1 + (holdScale(it) - 1) * ek);
  const sh = p.userData.shadow;
  if (sh) sh.material.opacity = SCENE_CONFIG.contactShadow.opacity * (1 - ek) * (1 - 0.35 * it.hv);
}

// Animation loop for hover, flights and the camera; runs only while something moves.
let fxRaf = 0, fxLast = 0;
function startFx() {
  if (fxRaf) return;
  fxLast = performance.now();
  fxRaf = requestAnimationFrame(fxTick);
}
function fxTick(now) {
  // (the first frame's timestamp can be slightly before startFx ran, so never let dt go negative)
  const dt = Math.max(0, Math.min(0.1, (now - fxLast) / 1000));
  fxLast = now;
  const time = now / 1000;
  let active = false;
  let kMax = 0;
  for (const it of pickables) {
    it.hv += (it.hoverTarget - it.hv) * (1 - Math.exp(-dt * 4 / SEL.hover.seconds));
    if (Math.abs(it.hoverTarget - it.hv) < 1e-3) it.hv = it.hoverTarget;
    // Hint wiggle: rocks `times` times, softening toward the end.
    it.wiggleAngle = 0;
    if (it.wiggle) {
      const w = it.wiggle;
      w.t += dt;
      if (w.t >= 0) {
        const u = w.t / w.dur;
        if (u >= 1) it.wiggle = null;
        else it.wiggleAngle = SEL.hint.angleDeg * DEG * Math.sin(Math.PI * 2 * SEL.hint.times * u) * (1 - 0.4 * u);
      }
    }
    if (it.anim) {
      const a = it.anim;
      a.t += dt;
      const u = clamp01(a.t / a.dur);
      it.k = a.from + (a.to - a.from) * u;
      if (u >= 1) { it.k = a.to; it.anim = null; a.resolve(); }
    }
    if (it.hoverTarget > 0 || it.hv !== 0 || it.k > 0 || it.anim || it.wiggle) active = true;
    kMax = Math.max(kMax, it.k);
    poseItem(it, time);
  }
  // Camera eases in toward Ashly: the whole stage (picture + 3D + sticker) scales together.
  const zoom = reduced() ? 1 : 1 + (SEL.camera.zoom - 1) * easeInOutCubic(kMax);
  stage.style.transformOrigin = `${SEL.camera.origin[0]}% ${SEL.camera.origin[1]}%`;
  stage.style.transform = zoom > 1.0001 ? `translate(-50%, -50%) scale(${zoom})` : '';
  render();
  fxRaf = active ? requestAnimationFrame(fxTick) : 0;
}

function flyTo(it, to) {
  return new Promise((resolve) => {
    if (it.anim) it.anim.resolve();
    const dur = Math.max(0.001, SEL.fly.seconds * Math.abs(to - it.k));
    it.anim = { from: it.k, to, t: 0, dur, resolve };
    startFx();
  });
}

// Sticker: starts flat on the wall (skewed like the wall), peels off and flips to face the viewer.
let stickerAnim = null;
function peelFrames() {
  const s = SEL.sticker;
  return [
    { offset: 0,    opacity: 0, transform: `perspective(1200px) skewY(${s.wallSkewDeg}deg) rotateY(0deg) scale(0.94)` },
    { offset: 0.2,  opacity: 1, transform: `perspective(1200px) skewY(${s.wallSkewDeg}deg) rotateY(0deg) scale(0.96)` },
    { offset: 0.6,  opacity: 1, transform: `perspective(1200px) skewY(${s.wallSkewDeg * 0.45}deg) rotateY(-50deg) scale(1.03)` },
    { offset: 1,    opacity: 1, transform: `perspective(1200px) skewY(0deg) rotateY(0deg) rotate(${s.tiltDeg}deg) scale(1)` },
  ];
}
function showSticker(it) {
  const { info } = it;
  stickerEl.querySelector('.sticker-title').textContent = info.title;
  stickerEl.querySelector('.sticker-text').textContent = info.text || '';
  const link = stickerEl.querySelector('.sticker-link');
  if (info.link) {
    link.href = info.link;
    link.textContent = SCENE_CONFIG.stickerLinkText;
    link.style.display = '';
    link.tabIndex = 0;
    link.setAttribute('aria-label', `${SCENE_CONFIG.stickerLinkText.replace(/[→\s]+$/, '')}: ${info.title}`);
  } else {
    link.removeAttribute('href');
    link.style.display = 'none';
    link.tabIndex = -1;
  }
  stickerEl.classList.add('on');
  stickerEl.setAttribute('aria-hidden', 'false');
  announcer.textContent = `${info.title}. ${info.text || ''}`;
  if (stickerAnim) stickerAnim.cancel();
  stickerAnim = stickerEl.animate(peelFrames(), {
    duration: SEL.sticker.peelSeconds * 1000, easing: 'cubic-bezier(.25,.8,.3,1)', fill: 'forwards',
  });
  return stickerAnim.finished.catch(() => {});
}
function hideSticker() {
  stickerEl.classList.remove('on');
  stickerEl.setAttribute('aria-hidden', 'true');
  stickerEl.querySelector('.sticker-link').tabIndex = -1;
  announcer.textContent = '';
  if (stickerAnim) stickerAnim.cancel();
  stickerAnim = stickerEl.animate(peelFrames(), {
    duration: SEL.sticker.peelSeconds * 1000 * 0.8, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards', direction: 'reverse',
  });
  return stickerAnim.finished.catch(() => {});
}

async function selectItem(it) {
  state.held = it;
  it.wiggle = null;
  it.button.setAttribute('aria-pressed', 'true');
  hideTag(); // the big sticker takes over
  state.turnTarget = 0; // Ashly stops following the mouse while she holds something
  state.seconds = I.fadeSeconds;
  startLoop();
  await Promise.all([showSticker(it), flyTo(it, 1)]);
}
async function deselect() {
  const it = state.held;
  if (!it) return;
  state.held = null;
  it.button.setAttribute('aria-pressed', 'false');
  state.turnTarget = reduced() ? 0 : state.target;
  state.seconds = I.fadeSeconds;
  startLoop();
  await Promise.all([hideSticker(), flyTo(it, 0)]);
  updateTag(); // if the mouse is still over it, its tag comes back
}
// Clicks are queued, so "held goes back first, then the new one flies in" always holds.
let selQueue = Promise.resolve();
function enqueue(fn) { selQueue = selQueue.then(fn, fn); return selQueue; }
function toggle(it) {
  return enqueue(async () => {
    if (state.held === it) return deselect();
    if (state.held) await deselect();
    return selectItem(it);
  });
}
function release() { return enqueue(() => deselect()); }

// Which object is under the pointer (Ashly blocks objects behind her).
function pickAt(clientX, clientY) {
  const r = stage.getBoundingClientRect(); // includes the camera zoom
  pickNdc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  pickRay.setFromCamera(pickNdc, camera);
  const targets = pickables.map((i) => i.p);
  if (state.ashly) targets.push(state.ashly);
  const hit = pickRay.intersectObjects(targets, true)[0];
  if (!hit) return null;
  let o = hit.object;
  while (o && !pickMap.has(o) && o !== state.ashly) o = o.parent;
  return pickMap.get(o) || null;
}

function setHovered(it) {
  if (hovered === it) return;
  if (hovered && document.activeElement !== hovered.button) hovered.hoverTarget = 0;
  hovered = it;
  if (it) { it.hoverTarget = 1; it.wiggle = null; }
  document.documentElement.style.cursor = it ? 'pointer' : '';
  startFx();
  updateTag();
}

let lastPointer = null, hoverRaf = 0;
window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return;
  lastPointer = e;
  if (!hoverRaf) hoverRaf = requestAnimationFrame(() => {
    hoverRaf = 0;
    if (!state.interactive || !pickables.length) return;
    const overSticker = lastPointer.target.closest && lastPointer.target.closest('.sticker');
    setHovered(overSticker ? null : pickAt(lastPointer.clientX, lastPointer.clientY));
  });
});
document.documentElement.addEventListener('mouseleave', () => setHovered(null));

window.addEventListener('click', (e) => {
  if (!state.interactive) return;
  if (state.suppressClick) { state.suppressClick = false; return; } // the click that skipped the intro
  if (e.target.closest && e.target.closest('.sticker')) return;    // let the sticker link work
  const it = pickAt(e.clientX, e.clientY);
  if (it) toggle(it);
  else if (state.held) release();
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.interactive && state.held) release();
});

/* ---------- start: load everything, then intro or final scene ---------- */
if (DEBUG) addDebug();
const placed = await Promise.all(SCENE_CONFIG.models.map((cfg) =>
  placeModel(cfg).catch((e) => console.error('Failed to load', cfg.file, e))));
state.ashly = placed.find((p) => p && p.name === 'ashly') || null;
try { await stage.querySelector('img').decode(); } catch {}
applyMood();
resize();

const params = new URLSearchParams(location.search);
const introAt = params.has('introAt') ? parseFloat(params.get('introAt')) : null;
const INTRO_KEY = 'room-intro-played';
let playedThisSession = false;
try { playedThisSession = sessionStorage.getItem(INTRO_KEY) === '1'; } catch {}
const playIntro = introAt !== null ||
  (N.enabled && !reduceMotionQuery.matches && (params.has('intro') || !playedThisSession));

const objects = placed.filter((p) => p && p !== state.ashly);
const flights = prepareFlights(objects);
setupSelection(objects); // reads the resting positions, so it runs before the intro moves anything
window.__room = { scene, camera, placed, SCENE_CONFIG, THREE, render, state, setTarget, flights, applyIntro, finishIntro,
  pickables, toggle, release, pickAt };

if (!playIntro) {
  finishIntro(flights);
} else if (introAt !== null) {
  applyIntro(introAt, flights); // test helper: frozen at one moment
  render();
} else {
  try { sessionStorage.setItem(INTRO_KEY, '1'); } catch {}
  const total = introEnd(flights);
  let raf = 0;
  const t0 = performance.now();
  const skip = (e) => {
    // A click that skips the intro should not also pick up an object.
    if (e && e.type === 'pointerdown') state.suppressClick = true;
    cancelAnimationFrame(raf);
    window.removeEventListener('pointerdown', skip, true);
    window.removeEventListener('keydown', skip, true);
    finishIntro(flights);
  };
  window.addEventListener('pointerdown', skip, true);
  window.addEventListener('keydown', skip, true);
  const step = (now) => {
    const t = (now - t0) / 1000;
    if (t >= total) { skip(); return; }
    applyIntro(t, flights);
    render();
    raf = requestAnimationFrame(step);
  };
  applyIntro(0, flights);
  render();
  raf = requestAnimationFrame(step);
}
</script>
</body>
</html>
