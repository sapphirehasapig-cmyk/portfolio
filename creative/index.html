<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashly's Room</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    /* same cream as the edges of room.jpg (very slightly warmer at the bottom) */
    background: #F2E6D6 linear-gradient(#F2E6D6, #F2E5D2) fixed;
  }
  /* The stage keeps the image's aspect ratio and fits the window without cropping.
     The background image and the 3D canvas share this exact box, so they stay aligned on resize. */
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 2752 / 1536));
    height: min(100vh, calc(100vw * 1536 / 2752));
    opacity: 0; /* hidden (only the cream background shows) until the image and all models are loaded */
    transform-origin: 50% 50%;
  }
  #stage img, #stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #stage img { user-select: none; -webkit-user-drag: none; }
  /* Soft light-mood layers between the room picture and the 3D canvas. */
  #stage .mood {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    will-change: opacity;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage">
  <img src="room.jpg" alt="An isometric cozy room" draggable="false">
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   SCENE_CONFIG: every position, size and rotation lives here.

   World units = pixels of room.jpg (2752 x 1536).
   Origin = the back floor corner, where the two walls meet.
     +x runs along the RIGHT wall toward the front-right.
     +z runs along the LEFT wall toward the front-left.
     +y is up.

   So for any point:  x = distance from the LEFT wall,  z = distance from the RIGHT wall.
   The floor is a square from (0,0) to (1207,1207).

   Each model:
     at         - [x, z] world position of the CENTER OF THE OBJECT'S BASE.
     surface    - which surface it stands on (its height and footprint are in `surfaces`).
     heightFrac - on-screen height of the object as a fraction of the image height.
     faceDeg    - which way the object's front faces (world yaw):
                    0  = straight out of the right wall (+z)
                    90 = straight out of the left wall (+x)
                    45 = straight at the viewer
     modelYawDeg - extra turn to fix a model whose "front" is not +z in its file.
     shadow     - size multiplier for its soft contact shadow.
   ===================================================================== */
const SCENE_CONFIG = {
  image: { src: 'room.jpg', width: 2752, height: 1536 },

  camera: {
    yawDeg: 45,          // looking straight into the back corner
    elevationDeg: 27.4,  // how far the camera looks down
    originPx: [1404, 660], // where the back floor corner sits in room.jpg
    zoom: 1,             // 1 = one world unit per image pixel
  },

  // Room box, used only by the ?debug outline.
  room: { size: 1207, wallHeight: 627 },

  // Surfaces objects stand on, measured from the illustration.
  //   y = height of the top, x/z = footprint [min, max] (shown with ?debug).
  surfaces: {
    ground: { y: -73 },                                    // outside, below the floor slab
    floor:  { y: 0,   x: [0, 1207],  z: [0, 1207] },
    rug:    { y: 2,   x: [535, 913], z: [127, 505] },     // round rug, center (724, 316), radius ~189
    desk:   { y: 190, x: [0, 230],   z: [656, 1066] },    // against the left wall, under the window
    shelf:  { y: 400, x: [0, 90],    z: [290, 600] },     // wall shelf on the left wall
    bench:  { y: 115, x: [555, 940], z: [15, 125] },      // low bench along the right wall
  },

  lights: {
    hemiSky: 0xfff3e2, hemiGround: 0xe9c7a6, hemiIntensity: 1.4,
    keyColor: 0xfff0dc, keyIntensity: 1.6, keyPosition: [-200, 1400, 1400],
    environmentIntensity: 0.45,
    exposure: 1.0,
  },

  materials: { roughnessMin: 0.85, metalness: 0 },

  contactShadow: { color: 0x6e4a30, opacity: 0.4, padding: 1.35 },

  /* Mouse reaction (step 2).
     The mouse's horizontal position becomes a "mood" from -1 (left) to +1 (right), 0 = middle. */
  interaction: {
    middleZone: 0.12,     // fraction of half the window around the center that counts as "middle"
    fadeSeconds: 0.6,     // how long lights and turn take to settle
    returnSeconds: 1.2,   // slower, calmer return when the mouse leaves the window
    maxTurnDeg: 25,       // how far Ashly turns toward the mouse side (never more than ~30)
    strength: 1,          // overall multiplier for every light change below (0 = off)

    // Layers on the room picture. center/size are % of the image; max = opacity at full mood.
    overlays: {
      daylight: { side: 'left',  color: '#c6ddff', blend: 'screen',     center: [30, 44], size: [26, 46], max: 0.5 },
      lampGlow: { side: 'right', color: '#ffa552', blend: 'soft-light', center: [62, 42], size: [26, 44], max: 1.0 },
      lampLift: { side: 'right', color: '#ffd59c', blend: 'screen',     center: [61, 40], size: [22, 36], max: 0.4 },
      dimLeft:  { side: 'dimLeft',  color: '#6f5444', blend: 'multiply', center: [30, 48], size: [28, 48], max: 0.45 },
      dimRight: { side: 'dimRight', color: '#6f5444', blend: 'multiply', center: [67, 48], size: [28, 48], max: 0.45 },
    },

    // Matching 3D lights (world units, see the axes note above).
    lights3d: {
      daylight: { color: 0xd2e3ff, position: [140, 460, 860], distance: 1250, max: 2.4 }, // near the window
      lamp:     { color: 0xffa95e, position: [436, 430, 120], distance: 1200, max: 2.8 }, // at the floor lamp
      hemiDip: 0.2,   // the overall fill drops this much at full mood, so the "off" side dims
    },
  },

  /* Intro animation (step 3). All times in seconds from the start of the intro.
     Plays once per browser session; a click or key press skips it; "reduce motion" skips it.
     Test helpers: ?intro plays it again, ?introAt=1.2 freezes it at that moment. */
  intro: {
    enabled: true,
    room: {
      start: 0, end: 0.6,
      fromScale: 0.85,   // room image + 3D layer start at 85% size, transparent
      bounce: 1.4,       // strength of the soft overshoot at the end (0 = none)
    },
    ashly: {
      start: 0.5, end: 1.4,
      fromDeg: 80,       // starts turned 80° to HER left (side view, never her back); turns clockwise
                         // (use -80 and overshootDeg 10 for the opposite, counter-clockwise turn)
      overshootDeg: -10, // swings this far past the front, then settles
      turnFrac: 0.65,    // part of the time spent on the main turn (rest = settling back)
    },
    objects: {
      gatherAt: 0.9,     // the 9 objects appear, tiny, around Ashly's hand
      start: 1.1,        // first object leaves
      stagger: 0.08,     // delay between objects
      duration: 0.66,    // flight + landing time of each object (last one lands at ~2.4 s)
      flightFrac: 0.78,  // part of `duration` spent flying; the rest is the landing bounce
      fromScale: 0.15,   // size at the hand
      sweepDeg: 70,      // how far each one swings around Ashly (same direction for all = fan)
      order: 'right-to-left', // which side leaves first: 'right-to-left' or 'left-to-right'
      lift: 140,         // how high the arcs rise (world units)
      hop: 14,           // height of the small landing bounce
      handPoint: [830, 400, 1113], // world point next to Ashly's raised hand
      gatherRadius: 40,  // how tightly they are bunched at the hand
    },
  },

  models: [
    { name: 'ashly',       file: 'models/ashly.glb',       surface: 'floor',  at: [1030, 1115], heightFrac: 0.48,  faceDeg: 45, modelYawDeg: 0, shadow: 1 },
    { name: 'websites',    file: 'models/websites.glb',    surface: 'desk',   at: [25, 1032],   heightFrac: 0.112, faceDeg: 90, modelYawDeg: 0, shadow: 1 },
    { name: 'jobhub',      file: 'models/jobhub.glb',      surface: 'desk',   at: [100, 900],   heightFrac: 0.145, faceDeg: 90, modelYawDeg: 0, shadow: 1 },
    { name: 'bloombento',  file: 'models/bloombento.glb',  surface: 'desk',   at: [150, 710],   heightFrac: 0.145,faceDeg: 90, modelYawDeg: 0, shadow: 1 },
    { name: 'less-stress', file: 'models/less-stress.glb', surface: 'shelf',  at: [45, 430],    heightFrac: 0.055, faceDeg: 90, modelYawDeg: 0, shadow: 1 },
    { name: 'suitcase',    file: 'models/suitcase.glb',    surface: 'floor',  at: [145, 58],    heightFrac: 0.11,faceDeg: 45, modelYawDeg: 0, shadow: 1 },
    { name: 'ski',         file: 'models/ski.glb',         surface: 'floor',  at: [280, 62],    heightFrac: 0.163, faceDeg: 45, modelYawDeg: 0, shadow: 1 },
    { name: 'keyboard',    file: 'models/keyboard.glb',    surface: 'bench',  at: [760, 70],    heightFrac: 0.122, faceDeg: 0, modelYawDeg: 0, shadow: 1 },
    { name: 'easel',       file: 'models/easel.glb',       surface: 'rug',    at: [830, 430],   heightFrac: 0.13,  faceDeg: 45, modelYawDeg: 0, shadow: 1 },
    { name: 'parkflux',    file: 'models/parkflux.glb',    surface: 'ground', at: [60, 1466],   heightFrac: 0.11,  faceDeg: 45, modelYawDeg: 0, shadow: 1 },
  ],
};

/* ---------- renderer, scene, camera ---------- */
const DEBUG = new URLSearchParams(location.search).has('debug');
const stage = document.getElementById('stage');
const IMG_W = SCENE_CONFIG.image.width;
const IMG_H = SCENE_CONFIG.image.height;
const DEG = Math.PI / 180;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = SCENE_CONFIG.lights.exposure;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Orthographic camera whose frustum is exactly the image, in image pixels.
// The back floor corner (world origin) lands on camera.originPx.
const camera = (() => {
  const c = SCENE_CONFIG.camera;
  const [u0, v0] = c.originPx;
  const cam = new THREE.OrthographicCamera(-u0, IMG_W - u0, v0, v0 - IMG_H, 1, 20000);
  const yaw = c.yawDeg * DEG, el = c.elevationDeg * DEG, dist = 8000;
  cam.position.set(Math.sin(yaw) * Math.cos(el) * dist, Math.sin(el) * dist, Math.cos(yaw) * Math.cos(el) * dist);
  cam.lookAt(0, 0, 0);
  cam.zoom = c.zoom;
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld();
  return cam;
})();

/* ---------- lights: soft and even, matte look ---------- */
const lights = (() => {
  const L = SCENE_CONFIG.lights;
  const hemi = new THREE.HemisphereLight(L.hemiSky, L.hemiGround, L.hemiIntensity);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(L.keyColor, L.keyIntensity);
  key.position.set(...L.keyPosition);
  scene.add(key);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = L.environmentIntensity;

  // Mood lights: start at 0, the mouse reaction fades them in.
  const makeMoodLight = (c) => {
    const p = new THREE.PointLight(c.color, 0, c.distance, 0); // decay 0 = soft cutoff at `distance`
    p.position.set(...c.position);
    scene.add(p);
    return p;
  };
  const M = SCENE_CONFIG.interaction.lights3d;
  return { hemi, key, daylight: makeMoodLight(M.daylight), lamp: makeMoodLight(M.lamp) };
})();

/* ---------- helpers ---------- */

// Exact on-screen height (in image pixels) of an object, from its vertices.
function screenHeight(object) {
  object.updateMatrixWorld(true);
  const view = camera.matrixWorldInverse;
  const v = new THREE.Vector3();
  let min = Infinity, max = -Infinity;
  object.traverse((m) => {
    if (!m.isMesh) return;
    const pos = m.geometry.attributes.position;
    const toView = new THREE.Matrix4().multiplyMatrices(view, m.matrixWorld);
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(toView);
      if (v.y < min) min = v.y;
      if (v.y > max) max = v.y;
    }
  });
  return max - min;
}

// Exact world bounding box from vertices (Box3.setFromObject can be loose).
function tightBox(object) {
  object.updateMatrixWorld(true);
  const box = new THREE.Box3();
  object.traverse((m) => { if (m.isMesh) box.expandByObject(m, true); });
  return box;
}

function makeShadowTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const shadowTexture = makeShadowTexture();

function addContactShadow(object, y, sizeMul) {
  const S = SCENE_CONFIG.contactShadow;
  // Footprint in the object's own turned frame, so the shadow lines up with it.
  const yaw = object.rotation.y;
  const inv = new THREE.Matrix4().makeRotationY(-yaw);
  const local = new THREE.Box3();
  const v = new THREE.Vector3();
  object.updateMatrixWorld(true);
  object.traverse((m) => {
    if (!m.isMesh) return;
    const pos = m.geometry.attributes.position;
    const toLocal = new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld);
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(toLocal);
      // only the lowest part of the object casts the contact shadow
      local.expandByPoint(v);
    }
  });
  const w = (local.max.x - local.min.x) * S.padding * sizeMul;
  const d = (local.max.z - local.min.z) * S.padding * sizeMul;
  const mat = new THREE.MeshBasicMaterial({
    map: shadowTexture, color: S.color, transparent: true, opacity: S.opacity,
    depthWrite: false, toneMapped: false,
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  plane.rotation.order = 'YXZ';
  plane.rotation.set(-Math.PI / 2, yaw, 0);
  const c = local.getCenter(new THREE.Vector3()).applyMatrix4(new THREE.Matrix4().makeRotationY(yaw));
  plane.position.set(c.x, y + 0.5, c.z);
  plane.renderOrder = -1;
  scene.add(plane);
  return plane;
}

function makeMatte(object) {
  const M = SCENE_CONFIG.materials;
  object.traverse((m) => {
    if (!m.isMesh) return;
    for (const mat of [].concat(m.material)) {
      if ('roughness' in mat) mat.roughness = Math.max(mat.roughness ?? 1, M.roughnessMin);
      if ('metalness' in mat) mat.metalness = M.metalness;
      mat.needsUpdate = true;
    }
  });
}

/* ---------- load and place models ---------- */
const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader().setDRACOLoader(draco);

async function placeModel(cfg) {
  const gltf = await loader.loadAsync(cfg.file);
  const inner = gltf.scene;
  makeMatte(inner);

  // pivot (sits on the surface at `at`; turning it spins the object in place)
  //   └ obj (world facing + scale, offset so its base center is the pivot)
  //       └ inner (per-model fix)
  inner.rotation.y = cfg.modelYawDeg * DEG;
  const obj = new THREE.Group();
  obj.add(inner);
  obj.rotation.y = cfg.faceDeg * DEG;
  const pivot = new THREE.Group();
  pivot.name = cfg.name;
  pivot.add(obj);
  scene.add(pivot);

  // Scale to the wanted on-screen height.
  obj.scale.setScalar((cfg.heightFrac * IMG_H) / screenHeight(pivot));

  // Center of the base on the pivot, bottom exactly on the surface.
  const box = tightBox(pivot);
  const center = box.getCenter(new THREE.Vector3());
  obj.position.set(-center.x, -box.min.y, -center.z);
  const y = SCENE_CONFIG.surfaces[cfg.surface].y;
  pivot.position.set(cfg.at[0], y, cfg.at[1]);
  pivot.updateMatrixWorld(true);

  pivot.userData.shadow = addContactShadow(obj, y, cfg.shadow);
  pivot.userData.surfaceY = y;
  return pivot;
}

/* ---------- debug outline (?debug) ---------- */
function addDebug() {
  const { size: L, wallHeight: H } = SCENE_CONFIG.room;
  const mat = new THREE.LineBasicMaterial({ color: 0x0066ff, depthTest: false });
  const line = (pts, m = mat) => {
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map((p) => new THREE.Vector3(...p))), m);
    l.renderOrder = 999; scene.add(l);
  };
  line([[L, 0, 0], [0, 0, 0], [0, 0, L], [L, 0, L], [L, 0, 0]]);
  line([[0, 0, 0], [0, H, 0]]);
  line([[L, H, 0], [0, H, 0], [0, H, L]]);
  line([[L, 0, 0], [L, H, 0]]);
  line([[0, 0, L], [0, H, L]]);
  const green = new THREE.LineBasicMaterial({ color: 0x00aa44, depthTest: false });
  for (const s of Object.values(SCENE_CONFIG.surfaces)) {
    if (!s.x) continue;
    const [x0, x1] = s.x, [z0, z1] = s.z;
    line([[x0, s.y, z0], [x1, s.y, z0], [x1, s.y, z1], [x0, s.y, z1], [x0, s.y, z0]], green);
  }
  const red = new THREE.LineBasicMaterial({ color: 0xff0033, depthTest: false });
  for (const cfg of SCENE_CONFIG.models) {
    const y = SCENE_CONFIG.surfaces[cfg.surface].y;
    const [x, z] = cfg.at;
    line([[x, y, z], [x, 0, z]], red);
    line([[x - 30, y, z], [x + 30, y, z]], red);
    line([[x, y, z - 30], [x, y, z + 30]], red);
  }
}

/* ---------- size and render ---------- */
function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(r.width, r.height, false);
  render();
}
function render() { renderer.render(scene, camera); }
new ResizeObserver(resize).observe(stage);

/* ---------- mouse reaction: light mood + Ashly's turn ---------- */
const I = SCENE_CONFIG.interaction;

// Overlay layers on the room picture (inserted right after the <img>, under the canvas).
const overlayLayers = Object.values(I.overlays).map((o) => {
  const el = document.createElement('div');
  el.className = 'mood';
  const [cx, cy] = o.center, [w, h] = o.size;
  el.style.background = `radial-gradient(ellipse ${w}% ${h}% at ${cx}% ${cy}%, ` +
    `${o.color} 0%, color-mix(in srgb, ${o.color} 55%, transparent) 45%, transparent 100%)`;
  el.style.mixBlendMode = o.blend;
  stage.insertBefore(el, renderer.domElement);
  return { el, o };
});

const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
const state = {
  target: 0,      // where the mood wants to go (-1..1)
  mood: 0,        // current, eased value
  turnTarget: 0,  // where Ashly's turn wants to go (-1..1)
  turn: 0,        // current, eased turn
  seconds: I.fadeSeconds,
  ashly: null,
  interactive: false, // turned on when the intro is over (or skipped)
};

// Mouse x (0..1 across the window) -> mood (-1..1) with a calm middle zone and soft edges.
function moodFromX(fx) {
  const m = Math.max(-1, Math.min(1, (fx - 0.5) * 2));
  const t = Math.max(0, (Math.abs(m) - I.middleZone) / (1 - I.middleZone));
  const eased = t * t * (3 - 2 * t); // smoothstep
  return Math.sign(m) * eased;
}

function setTarget(mood, seconds) {
  if (!state.interactive) return; // ignore the mouse during the intro
  state.target = mood;
  state.turnTarget = reduceMotionQuery.matches ? 0 : mood;
  state.seconds = seconds;
  startLoop();
}

function applyMood() {
  const k = I.strength;
  const left = Math.max(0, -state.mood) * k;
  const right = Math.max(0, state.mood) * k;
  const amount = { left, right, dimLeft: right, dimRight: left };
  for (const { el, o } of overlayLayers) el.style.opacity = (amount[o.side] * o.max).toFixed(4);

  const L3 = I.lights3d;
  lights.daylight.intensity = left * L3.daylight.max;
  lights.lamp.intensity = right * L3.lamp.max;
  lights.hemi.intensity = SCENE_CONFIG.lights.hemiIntensity * (1 - L3.hemiDip * (left + right));

  if (state.ashly) state.ashly.rotation.y = state.turn * I.maxTurnDeg * DEG;
}

let rafId = 0, lastTime = 0;
function startLoop() {
  if (rafId) return;
  lastTime = performance.now();
  rafId = requestAnimationFrame(tick);
}
function tick(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  // Exponential ease-out: ~98% of the way there after `seconds`.
  const f = 1 - Math.exp(-dt * 4 / state.seconds);
  state.mood += (state.target - state.mood) * f;
  state.turn += (state.turnTarget - state.turn) * f;
  const done = Math.abs(state.target - state.mood) < 1e-3 && Math.abs(state.turnTarget - state.turn) < 1e-3;
  if (done) { state.mood = state.target; state.turn = state.turnTarget; }
  applyMood();
  render();
  rafId = done ? 0 : requestAnimationFrame(tick);
}

window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') return; // desktop only
  setTarget(moodFromX(e.clientX / window.innerWidth), I.fadeSeconds);
});
// Mouse leaves the window (or the window loses focus): slowly back to the middle.
document.documentElement.addEventListener('mouseleave', () => setTarget(0, I.returnSeconds));
window.addEventListener('blur', () => setTarget(0, I.returnSeconds));
// "Reduce motion" switched on or off while the page is open.
reduceMotionQuery.addEventListener('change', () => setTarget(state.target, I.fadeSeconds));

/* ---------- intro animation (step 3) ---------- */
const N = SCENE_CONFIG.intro;
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
const easeOutBack = (t, s) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);

function setStage(scale, opacity) {
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  stage.style.opacity = String(opacity);
}

// Work out each object's arc: polar coordinates around Ashly's hand, all swinging the same way.
function prepareFlights(objects) {
  const O = N.objects;
  const [hx, , hz] = O.handPoint;
  const sweep = O.sweepDeg * DEG;
  const back = Math.atan2(-1, -1); // direction away from the viewer, used to order the fan
  const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
  const flights = objects.map((p) => {
    const end = p.position.clone();
    const dx = end.x - hx, dz = end.z - hz;
    const a1 = Math.atan2(dz, dx);
    return { p, end, r1: Math.hypot(dx, dz), a1, a0: a1 - sweep, order: wrap(a1 - back) };
  });
  // Leave in fan order, so the opening sweeps across in one direction.
  // (`order` grows from the left side of the room to the right side.)
  const dir = O.order === 'left-to-right' ? 1 : -1;
  flights.sort((a, b) => dir * (a.order - b.order));
  flights.forEach((f, i) => { f.start = O.start + i * O.stagger; });
  return flights;
}

function introEnd(flights) {
  const lastLanding = flights.length ? flights[flights.length - 1].start + N.objects.duration : 0;
  return Math.max(N.room.end, N.ashly.end, lastLanding);
}

// Pose the whole scene at intro time t (seconds).
function applyIntro(t, flights) {
  // 1. Room pops in.
  const R = N.room;
  const tr = seg(t, R.start, R.end);
  setStage(R.fromScale + (1 - R.fromScale) * easeOutBack(tr, R.bounce),
           easeOutCubic(seg(t, R.start, R.start + (R.end - R.start) * 0.7)));

  // 2. Ashly turns from side view to the front, swings a little past, settles.
  const A = N.ashly;
  const ta = seg(t, A.start, A.end);
  const deg = ta < A.turnFrac
    ? A.fromDeg + (A.overshootDeg - A.fromDeg) * easeInOutSine(ta / A.turnFrac)
    : A.overshootDeg * (1 - easeInOutSine((ta - A.turnFrac) / (1 - A.turnFrac)));
  if (state.ashly) state.ashly.rotation.y = deg * DEG;

  // 3. Objects fly out from her hand along curved arcs and land with a small bounce.
  const O = N.objects;
  const [hx, hy, hz] = O.handPoint;
  const baseShadow = SCENE_CONFIG.contactShadow.opacity;
  for (const f of flights) {
    const { p, end } = f;
    const shadow = p.userData.shadow;
    if (t < O.gatherAt) {
      p.visible = false;
      if (shadow) shadow.material.opacity = 0;
      continue;
    }
    p.visible = true;
    const tt = (t - f.start) / O.duration;
    let q, hop = 0, landed = 0;
    if (tt <= 0) q = 0;
    else if (tt < O.flightFrac) q = easeOutCubic(tt / O.flightFrac);
    else {
      q = 1;
      landed = clamp01((tt - O.flightFrac) / (1 - O.flightFrac));
      hop = O.hop * Math.sin(Math.PI * landed);
    }
    const r = O.gatherRadius + (f.r1 - O.gatherRadius) * q;
    const a = f.a0 + (f.a1 - f.a0) * q;
    const y = hy + (end.y - hy) * q + O.lift * 4 * q * (1 - q) + hop;
    p.position.set(q === 1 ? end.x : hx + r * Math.cos(a), y, q === 1 ? end.z : hz + r * Math.sin(a));
    const appear = easeOutCubic(seg(t, O.gatherAt, O.gatherAt + 0.15)); // grows out of her hand
    p.scale.setScalar(appear * (O.fromScale + (1 - O.fromScale) * q));
    if (shadow) shadow.material.opacity = tt >= 1 ? baseShadow : baseShadow * easeOutCubic(landed);
  }
}

// Final scene: everything in place, mouse effects on.
function finishIntro(flights) {
  for (const f of flights || []) {
    f.p.visible = true;
    f.p.position.copy(f.end);
    f.p.scale.setScalar(1);
    if (f.p.userData.shadow) f.p.userData.shadow.material.opacity = SCENE_CONFIG.contactShadow.opacity;
  }
  if (state.ashly) state.ashly.rotation.y = 0;
  stage.style.transform = '';
  stage.style.opacity = '1';
  state.interactive = true;
  applyMood();
  render();
}

/* ---------- start: load everything, then intro or final scene ---------- */
if (DEBUG) addDebug();
const placed = await Promise.all(SCENE_CONFIG.models.map((cfg) =>
  placeModel(cfg).catch((e) => console.error('Failed to load', cfg.file, e))));
state.ashly = placed.find((p) => p && p.name === 'ashly') || null;
try { await stage.querySelector('img').decode(); } catch {}
applyMood();
resize();

const params = new URLSearchParams(location.search);
const introAt = params.has('introAt') ? parseFloat(params.get('introAt')) : null;
const INTRO_KEY = 'room-intro-played';
let playedThisSession = false;
try { playedThisSession = sessionStorage.getItem(INTRO_KEY) === '1'; } catch {}
const playIntro = introAt !== null ||
  (N.enabled && !reduceMotionQuery.matches && (params.has('intro') || !playedThisSession));

const flights = prepareFlights(placed.filter((p) => p && p !== state.ashly));
window.__room = { scene, camera, placed, SCENE_CONFIG, THREE, render, state, setTarget, flights, applyIntro, finishIntro };

if (!playIntro) {
  finishIntro(flights);
} else if (introAt !== null) {
  applyIntro(introAt, flights); // test helper: frozen at one moment
  render();
} else {
  try { sessionStorage.setItem(INTRO_KEY, '1'); } catch {}
  const total = introEnd(flights);
  let raf = 0;
  const t0 = performance.now();
  const skip = () => {
    cancelAnimationFrame(raf);
    window.removeEventListener('pointerdown', skip, true);
    window.removeEventListener('keydown', skip, true);
    finishIntro(flights);
  };
  window.addEventListener('pointerdown', skip, true);
  window.addEventListener('keydown', skip, true);
  const step = (now) => {
    const t = (now - t0) / 1000;
    if (t >= total) { skip(); return; }
    applyIntro(t, flights);
    render();
    raf = requestAnimationFrame(step);
  };
  applyIntro(0, flights);
  render();
  raf = requestAnimationFrame(step);
}
</script>
</body>
</html>
