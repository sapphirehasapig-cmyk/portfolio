cript><!-- GA4 custom events for portfolio (added 2026-09) -->
<script>
(function () {
  if (typeof window.gtag !== 'function') return;

  // Case study pages: URL slug -> readable name used in reports
  var CASE = {
    'parkflux': 'ParkFlux',
    'website-design': 'Real Client Websites',
    'design-for-less-stress': 'Design for Less Stress',
    'job-search-tracker': 'Job Search Tracker'
  };
  function clean(p) { return (p || '/').replace(/\/+$/, '') || '/'; }
  function projectOf(path) {
    var parts = clean(path).split('/');
    if (CASE[parts[1]]) return CASE[parts[1]];
    if (parts[1] === 'work' && parts[2]) return 'work/' + parts[2];
    return null;
  }
  function send(name, params) { try { gtag('event', name, params || {}); } catch (e) {} }
  function textOf(el) {
    return (el.innerText || el.textContent || el.getAttribute('aria-label') || '')
      .replace(/\s+/g, ' ').trim().slice(0, 100);
  }

  var here = clean(location.pathname);
  var hereProject = projectOf(here);

  // 1) Clicks: contact, CV, project cards, navigation, external sites
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    var text = textOf(a);
    if (/^mailto:/i.test(href)) return send('contact_click', { contact_method: 'email', link_text: text });
    if (/^tel:/i.test(href)) return send('contact_click', { contact_method: 'phone', link_text: text });
    var url;
    try { url = new URL(a.href, location.href); } catch (err) { return; }
    if (/(^|\.)linkedin\.com$/i.test(url.hostname)) return send('contact_click', { contact_method: 'linkedin', link_url: url.href, link_text: text });
    if (/\.pdf$/i.test(url.pathname) || /\b(cv|resume)\b/i.test(text)) return send('cv_download', { link_url: url.href, link_text: text });
    if (url.hostname !== location.hostname) {
      return send('external_click', { project_name: hereProject || 'none', link_url: url.href, link_text: text });
    }
    var target = clean(url.pathname);
    if (target === here) return; // same-page anchor, ignore
    var proj = projectOf(target);
    if (proj) return send('project_click', { project_name: proj, link_text: text });
    send('nav_click', { link_url: target, link_text: text });
  }, true);

  // 2) Someone copies an email address instead of clicking it
  document.addEventListener('copy', function () {
    var s = String(window.getSelection ? window.getSelection() : '');
    if (s.indexOf('@') > -1) send('contact_click', { contact_method: 'email_copy' });
  });

  // 3) Video plays started by the visitor (skips autoplay background loops)
  document.addEventListener('play', function (e) {
    var v = e.target;
    if (!v || v.tagName !== 'VIDEO' || v.autoplay || v.__zxPlayed) return;
    v.__zxPlayed = 1;
    var src = (v.currentSrc || '').split('/').pop().split('?')[0];
    send('video_play', { project_name: hereProject || 'none', video_title: (v.getAttribute('title') || src).slice(0, 100) });
  }, true);

  // 4) Case study pages only: scroll depth + "really read it"
  if (!hereProject) return;
  var marks = [25, 50, 75, 100], hit = {}, waiting = false;
  function checkScroll() {
    waiting = false;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 0) return;
    var pct = (window.scrollY || window.pageYOffset) / max * 100;
    for (var i = 0; i < marks.length; i++) {
      var m = marks[i];
      if (!hit[m] && pct >= (m === 100 ? 97 : m)) {
        hit[m] = 1;
        send('case_study_scroll', { project_name: hereProject, scroll_depth: m });
      }
    }
  }
  window.addEventListener('scroll', function () {
    if (!waiting) { waiting = true; setTimeout(checkScroll, 250); }
  }, { passive: true });

  // "Read": 60 seconds with the tab visible AND scrolled past 25%
  var seen = 0, readSent = false;
  setInterval(function () {
    if (readSent || document.visibilityState !== 'visible') return;
    seen += 5;
    if (seen >= 60 && hit[25]) {
      readSent = true;
      send('case_study_read', { project_name: hereProject });
    }
  }, 5000);
})();
</script></body></html>
